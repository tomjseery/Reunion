name: Release

on:
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.strip.outputs.value }}
    steps:
      - id: strip
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ needs.version.outputs.package-version }}
      publish: true
